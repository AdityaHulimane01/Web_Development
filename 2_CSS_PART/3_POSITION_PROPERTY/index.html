<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position property</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .box {
            height: 133px;
            width: 80vw;
            margin: 3px;
            padding: 3px;
            border: 2px solid black;
        }
.parent{
    margin: 43px;
    padding: 34px;
    border: 4px solid blue;
}
        .box1 {
            background-color: bisque;
            position: relative;
            z-index:2;         
             /* z index is high of this box therfore it will be displayed above box 2 */
        }

        .box2 {
            background-color: aqua;
            position: relative;
            bottom: 100px;
            left: 50px;
            z-index: 1;
        }

        .box3 {
            background-color: aquamarine;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>
</body>

</html>
